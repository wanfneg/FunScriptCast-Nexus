<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>视频联动页 · 草图还原原型 v1</title>
<link rel="stylesheet" href="../ui/fonts.css"/>
<link rel="stylesheet" href="../ui/styles.css"/>
<style>
/* =====================================================================
   视频联动页 · 草图几何复刻（v1 原型）
   几何来源：视频联动页UI草图（集成预设）.html（drawio）
   内容区 = 770 × 570 草图单位；下面所有 fr 分母都取自草图实测坐标：
     行：大框框 320 | 10 | 时间轴 40 | 5 | 按钮行 40 | 5 | 下三列 150
     大框框      770               （x 30..800）
     时间轴      40 | 10 | 670 | 10 | 40   （当前进度 | 热力图 | 总时长）
     按钮行      340 | 25 | 40 | 25 | 340 （左三页签 | ⏸ | 右三胶囊）
     下三列      340 | 8 | 75 | 7 | 340   （设置卡 | 快捷动作 | 预设网格）
   ===================================================================== */
.page.active.vk-page{ display:flex; flex-direction:column; height:100%; padding-bottom:30px; }
.vk-page > .vk-scope{ flex:1; min-height:0; display:flex; flex-direction:column; }
.vk-frame{
  position:relative; flex:1; min-height:0; width:100%;
  display:grid;
  /* 草图原始比例：320 | 10 | 40 | 5 | 40 | 5 | 150 = 570。
     整帧填满内容区后，多余高度按此比例分配 —— 大框框拿到最多（用户要求"填满"）。 */
  grid-template-rows:320fr 10fr var(--vk-heat,40fr) 5fr 40fr 5fr 150fr;
}
body.heat88 .vk-frame{ --vk-heat:88px; }

/* ---- 公用板面（走主题令牌 --panel/--line/--ink） ---- */
.vk-panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); min-width:0; min-height:0; }

/* ---- ① 大框框：媒体库浏览 ⇄ 播放窗口 ---- */
.vk-stage{ grid-row:1; display:flex; flex-direction:column; padding:12px 14px; overflow:hidden; }
.vk-crumb{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex:none; }
.vk-crumb .vk-dir{ font-size:13px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vk-crumb .vk-count{ margin-left:auto; font-size:11.5px; color:var(--ink-3); flex:none; }
.vk-back{
  display:inline-flex; align-items:center; gap:5px; flex:none;
  background:var(--raise-2); border:1px solid var(--line); color:var(--ink-2);
  border-radius:var(--r-pill); padding:5px 12px; font:500 12px/1 var(--f-ui); cursor:pointer;
}
.vk-back:hover{ color:var(--ink); border-color:var(--line-3); }
.vk-grid{ flex:1; min-height:0; overflow-y:auto; display:grid; gap:12px; align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(var(--vk-cell,178px),1fr)); }
/* 竖版文件夹卡：图标上 / 名称下 */
.vk-folder{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:16px 10px; cursor:pointer; transition:border-color var(--dur-fast),transform var(--dur-fast); }
.vk-folder:hover{ border-color:var(--accent-line); transform:translateY(-2px); }
.vk-folder .ic{ width:40px; height:40px; color:var(--accent); }
.vk-folder .n{ font-size:12.5px; font-weight:600; color:var(--ink); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vk-folder .s{ font-size:11px; color:var(--ink-3); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 视频卡：缩略图 + ⟳徽标 + 时长 + 进度条 */
.vk-video{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; cursor:pointer;
  transition:border-color var(--dur-fast),transform var(--dur-fast); }
.vk-video:hover{ border-color:var(--accent-line); transform:translateY(-2px); }
.vk-thumb{ position:relative; aspect-ratio:16/10; background:
  linear-gradient(135deg,rgba(76,201,240,.16),rgba(123,92,255,.16)); display:flex; align-items:center; justify-content:center; }
.vk-thumb .ic{ width:30px; height:30px; color:var(--ink-3); opacity:.7; }
.vk-badges{ position:absolute; top:6px; left:6px; display:flex; gap:4px; }
.vk-badge{ background:rgba(0,0,0,.72); color:#7fd4ff;
  font:500 10.5px/1 var(--f-ui); padding:3px 6px; border-radius:var(--r-xs); display:flex; align-items:center; gap:3px; }
.vk-badge .ic{ width:11px; height:11px; }
.vk-badge.sub{ color:#ffd9a0; }
.vk-thumb .vk-fileic{ width:42px; height:42px; color:var(--ink-3); opacity:.5; }
.vk-dur{ position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.72); color:#fff;
  font:500 10.5px/1 var(--f-mono); padding:3px 6px; border-radius:var(--r-xs); }
.vk-prog{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.45); }
.vk-prog i{ display:block; height:100%; background:var(--accent); }
.vk-vmeta{ padding:8px 10px 9px; }
.vk-vmeta .t{ font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vk-vmeta .s{ font-size:11px; color:var(--ink-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 播放模式：画面镜像 + 文件名 */
.vk-play{ flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
.vk-mirror{ flex:1; min-height:0; position:relative; border-radius:var(--r-md); overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,rgba(76,201,240,.10),rgba(0,0,0,.55)),#0a0d14;
  border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
html[data-theme="light"] .vk-mirror{ background:radial-gradient(120% 120% at 50% 0%,rgba(10,123,163,.10),rgba(255,255,255,.4)),#0a0d14; }
.vk-mirror .nm{ color:#e9edf6; font-size:14px; font-weight:600; }
.vk-mirror .nt{ color:rgba(233,237,246,.55); font-size:11.5px; }
.vk-mirror .tag{ position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:6px;
  background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.12); border-radius:var(--r-pill); padding:4px 10px; }
.vk-mirror .tag .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
.vk-mirror .tag span{ color:#e9edf6; font-size:11px; }

/* ---- ② 时间轴：当前进度 | 脚本热力图 | 总时长 ---- */
.vk-timeline{ grid-row:3; display:grid; grid-template-columns:40fr 10fr 670fr 10fr 40fr; align-items:center; min-width:0; min-height:0; }
.vk-timeline > *{ min-width:0; min-height:0; }
.vk-time{ grid-column:1; font:500 13px/1.3 var(--f-mono); color:var(--ink-2); text-align:center; white-space:nowrap; overflow:hidden; }
.vk-time:last-child{ grid-column:5; }
.vk-time.now{ color:var(--ink); }
.vk-heat{ grid-column:3; width:100%; height:100%; min-width:0; min-height:0; display:block; background:var(--vk-heatbg);
  border-radius:var(--r-sm); cursor:crosshair; }

/* ---- ③ 按钮行：左三页签 | ⏸ | 右三胶囊 ---- */
.vk-btnrow{ grid-row:5; display:grid; grid-template-columns:340fr 25fr 40fr 25fr 340fr; align-items:center; min-width:0; min-height:0; }
.vk-btnrow > *{ min-width:0; min-height:0; }
.vk-group{ grid-column:1; display:flex; align-items:center; justify-content:space-between; height:75%; min-width:0; }
.vk-group > *{ width:22.06%; }                    /* 草图：75/340 */
.vk-cap{
  height:100%; min-width:0; padding:0 6px; cursor:pointer; white-space:nowrap; overflow:hidden;
  background:var(--raise-2); border:1px solid var(--line); border-radius:var(--r-pill);
  color:var(--ink); font:500 12.5px/1 var(--f-ui);
  transition:background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast);
}
.vk-cap:hover{ border-color:var(--line-3); }
.vk-cap.on{ background:var(--steel); border-color:transparent; color:#fff; }
.vk-cap.on.g{ background:var(--steel-green); }
.vk-cap.on.r{ background:var(--steel-red); }
#vkActions{ grid-column:5; }
.vk-round{
  grid-column:3; justify-self:center; align-self:center;
  min-width:0; min-height:0; border-radius:50%; cursor:pointer; padding:0;
  background:var(--raise-2); border:1px solid var(--line); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
}
.vk-round:hover{ border-color:var(--accent-line); }
.vk-round .ic{ width:20px; height:20px; }

/* ---- ④ 下三列 ---- */
.vk-lower{ grid-row:7; display:grid; grid-template-columns:340fr 8fr 75fr 7fr 340fr; align-items:stretch; min-width:0; min-height:0; }
.vk-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:12px 14px; display:flex; flex-direction:column; gap:12px; min-width:0; min-height:0; }
.vk-card > .ttl{ font-size:14px; font-weight:600; color:var(--ink); flex:none; }
/* 设置行（手机 SliderRow：小标签 + 大号粗体数值右对齐） */
.vk-row{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.vk-rowhead{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.vk-label{ font-size:11.5px; font-weight:500; color:var(--ink-2); flex:none; }
.vk-value{ margin-left:auto; font-size:17px; font-weight:700; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
.vk-value small{ font-size:11px; font-weight:500; color:var(--ink-3); }
.vk-link{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); cursor:pointer; user-select:none; }
.vk-link input{ width:13px; height:13px; accent-color:var(--steel); cursor:pointer; margin:0; }
.vk-rowbody{ display:flex; align-items:center; gap:10px; }
.vk-slider{ position:relative; flex:1; height:22px; min-width:0; }
.vk-slider.disabled{ opacity:.45; }
.vk-track{ position:absolute; left:0; right:0; top:50%; height:4px; transform:translateY(-50%); background:var(--line-2); border-radius:2px; }
.vk-fill{ position:absolute; top:50%; height:4px; transform:translateY(-50%); background:var(--steel); border-radius:2px; }
.vk-knob{ position:absolute; top:50%; width:15px; height:15px; transform:translate(-50%,-50%);
  background:var(--raise); border:2px solid var(--steel); border-radius:50%; cursor:grab; touch-action:none; }
.vk-knob:active{ cursor:grabbing; }
.vk-slider.disabled .vk-knob{ cursor:not-allowed; }
/* 中列：三个快捷动作（草图 = 竖排三颗，等高、两端对齐） */
.vk-quick{ grid-column:3; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
.vk-qbtn{ height:26.67%; min-height:0; width:100%; padding:0 4px; cursor:pointer; overflow:hidden;
  background:var(--raise-2); border:1px solid var(--line); border-radius:var(--r-pill); color:var(--ink);
  font:500 12px/1 var(--f-ui); white-space:nowrap; }
.vk-qbtn:hover{ border-color:var(--line-3); }
.vk-qbtn.on{ background:var(--steel); border-color:transparent; color:#fff; }
.vk-qbtn.on.g{ background:var(--steel-green); }
.vk-qbtn.on.r{ background:var(--steel-red); }
/* 右列：预设网格（两列，可见 2 行=草图 / 3 行=手机本体，全量 24 可滚） */
.vk-presets{ grid-column:5; padding:10px 12px; }
.vk-pgrid{ flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; }
.vk-pcard{ background:var(--raise-2); border-radius:10px; padding:6px 9px 7px; cursor:pointer;
  display:flex; flex-direction:column; min-width:0; overflow:hidden;
  border:1px solid transparent; transition:background var(--dur-fast); }
.vk-pcard:hover{ border-color:var(--line-2); }
.vk-pcard.sel{ background:var(--tile-sel); border-color:var(--steel-line); }
.vk-phead{ display:flex; align-items:center; gap:6px; flex:none; }
.vk-pname{ flex:1; min-width:0; font-size:11.5px; font-weight:500; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vk-pcard.sel .vk-pname{ color:var(--steel-ink); font-weight:600; }
.vk-ploop{ flex:none; font-size:9.5px; color:var(--ink-3); white-space:nowrap; }
.vk-wave{ flex:1; min-height:0; width:100%; display:block; margin-top:3px; }

/* ---- 页面作用域令牌：手机本体钢蓝 + 主题桥接 ---- */
.vk-scope{
  --vk-heatbg:#14171c;                 /* 暗色：类黑 */
  --steel:#4A5F8A; --steel-press:#3F5279;
  --steel-green:#2E7D32; --steel-red:#C0392B;
  --steel-line:rgba(74,95,138,.45);
  --steel-ink:#93a9d6;
  --tile-sel:rgba(74,95,138,.20);
}
html[data-theme="light"] .vk-scope{
  --vk-heatbg:#f2f1ed;                 /* 亮色：类白 */
  --steel-ink:#4A5F8A;                 /* 手机 SteelBlue */
  --tile-sel:#D6DFEC;                  /* 手机 ActiveTabBg（选中预设卡） */
  --steel-line:rgba(74,95,138,.35);
}
html[data-theme="light"] .vk-pcard{ background:#EEF0F4; }   /* 手机 CardEmbed */

/* ---- 草图对照层 ---- */
.vk-ghost{ position:absolute; inset:0; z-index:5; pointer-events:none; }
.vk-gbox{ position:absolute; border:1px dashed rgba(255,92,124,.7); border-radius:3px; }
html[data-theme="light"] .vk-gbox{ border-color:rgba(192,36,72,.75); }
.vk-gbox > b{ position:absolute; top:-8px; left:-1px; padding:1px 5px; border-radius:3px; white-space:nowrap;
  background:var(--bad); color:#fff; font:500 9.5px/1.5 var(--f-ui); }

/* ---- 评审控制条（不属于界面本身） ---- */
.vkctrl{ position:fixed; left:14px; bottom:14px; z-index:60; width:236px;
  background:var(--raise); border:1px solid var(--line-2); border-radius:var(--r-lg); box-shadow:var(--sh-2);
  padding:10px 12px; display:flex; flex-direction:column; gap:7px; }
.vkctrl h4{ margin:0 0 1px; font-size:11px; letter-spacing:.06em; color:var(--ink-3); font-weight:600; text-transform:uppercase; }
.vkctrl .r{ display:flex; align-items:center; gap:8px; }
.vkctrl .r > span{ font-size:11.5px; color:var(--ink-2); flex:none; width:78px; }
.vkctrl .seg{ display:flex; flex:1; gap:2px; background:var(--raise-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:2px; }
.vkctrl .seg button{ flex:1; border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  font:500 11px/1 var(--f-ui); padding:5px 2px; border-radius:var(--r-pill); white-space:nowrap; }
.vkctrl .seg button.on{ background:var(--steel); color:#fff; }
.vkctrl .note{ font-size:10.5px; line-height:1.45; color:var(--ink-3); border-top:1px solid var(--line); padding-top:7px; }
</style>
</head>

var HEAT_STOPS = [[0,0,0],[30,144,255],[34,139,34],[255,215,0],[220,20,60],[147,112,219],[37,22,122]];
var HEAT_BG   = { dark:"#14171c", light:"#f2f1ed" };   /* 类黑 / 类白：与页面底色区分，不用纯黑纯白 */
var HEAT_INK  = { dark:"#ffffff", light:"#1b1b1f" };   /* 播放头 */
function heatTheme(){ return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }
function heatBg(){ return HEAT_BG[heatTheme()]; }
function heatZero(){ var c = heatBg(); return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function heatColor(speed){
  var n = 120;
  if (speed <= 0) return heatZero();
  if (speed > 5*n) return HEAT_STOPS[6];
  var t = speed + n/2, i = Math.min(Math.floor(t/n), HEAT_STOPS.length-2);
  var f = Math.min(1, Math.max(0, (t - i*n)/n)), a = HEAT_STOPS[i], b = HEAT_STOPS[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
/* 手机 renderHeatmapBitmap 同构：速度窗 50 均值着色 + 位置窗 15 上下分位定条带 + 间隙 5s 重置 */
function renderHeatBitmap(ctx, w, h){
  ctx.fillStyle = heatBg(); ctx.fillRect(0,0,w,h);
  if (!ACTIONS || ACTIONS.length < 2) return;
  var d = w / (DUR*1000), SW = 50, PW = 15, GAPMS = 5000;
  var sp = [], po = [], xPrev = 0;
  for (var i=1;i<ACTIONS.length;i++){
    var atPrev = ACTIONS[i-1][0], atCur = ACTIONS[i][0], x = d*atCur;
    if (atCur - atPrev > GAPMS) { sp = []; po = []; xPrev = x; continue; }
    /* 手机 ScriptHeatmap 语义：|Δvalue(0..1)|×100 ÷ Δt(秒) = %/秒。
       旧实现除以毫秒 → 速度只有手机的 1/10，整条热力图永远落在最低那一档（全蓝）。 */
    var speed = Math.abs(ACTIONS[i][1]-ACTIONS[i-1][1]) / Math.max(1e-9, (atCur-atPrev)/1000);
    sp.push(speed); if (sp.length > SW) sp.shift();
    po.push(ACTIONS[i][1]); if (po.length > PW) po.shift();
    var avg = 0; for (var a=0;a<sp.length;a++) avg += sp[a]; avg /= sp.length;
    var col = heatColor(avg);
    if (po.length >= 2){
      var sorted = po.slice().sort(function(p,q){return p-q;});
      var mid = Math.floor(sorted.length/2), lo=0, up=0, k;
      for (k=0;k<mid;k++) lo += sorted[k];
      for (k=mid;k<sorted.length;k++) up += sorted[k];
      var loAvg = lo/mid, upAvg = up/(sorted.length-mid);
      var top = h - loAvg/100*h, bh = (loAvg-upAvg)/100*h;
      ctx.fillStyle = "rgb("+col.map(Math.round).join(",")+")";
      ctx.fillRect(xPrev, top, x-xPrev, bh);
    }
    xPrev = x;
  }
}
var heatOff = document.createElement("canvas"), heatKey = "";
function drawHeat(){
  var cv = $("#vkHeat"); if (!cv) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  var pw = Math.round(w*dpr), ph = Math.round(h*dpr);
  var key = pw+"x"+ph;
  if (heatKey !== key){
    heatOff.width = pw; heatOff.height = ph;
    var hctx = heatOff.getContext("2d");
    hctx.setTransform(dpr,0,0,dpr,0,0);
    renderHeatBitmap(hctx, w, h);
    heatKey = key;
  }
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  var ctx = cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,pw,ph);
  ctx.drawImage(heatOff, 0, 0);
  var x = Math.max(1, Math.min(pw-1, pw * (curPos/DUR)));
  ctx.fillStyle = HEAT_INK[heatTheme()];
  ctx.fillRect(Math.round(x-1*dpr), 0, Math.max(2, Math.round(2*dpr)), ph);
}

var CFG = {
  range:[0,100], maxSpeed:500,
  idleRange:[0,100], idleSpeed:100, idleLink:false,
  burstRange:[0,100], burstSpeed:500, burstLink:false, burstLinkSpeed:false
};
var CARDS = {
  stroke:{ title:"设备行程与速度", rows:[
    { label:"限制输出范围", kind:"dual", key:"range", fmt:function(){ return CFG.range[0]+"% - "+CFG.range[1]+"%"; } },
    { label:"设备速度上限", kind:"single", key:"maxSpeed", max:500, unit:"Units/s", fmt:function(){ return CFG.maxSpeed+"<small> Units/s</small>"; } }
  ]},
  idle:{ title:"待机缓动", rows:[
    { label:"运动范围", kind:"dual", key:"idleRange", link:"idleLink", linkLabel:"关联主输出",
      fmt:function(){ return CFG.idleLink ? (CFG.range[0]+"% - "+CFG.range[1]+"%<small> 关联主输出</small>") : (CFG.idleRange[0]+"% - "+CFG.idleRange[1]+"%"); } },
    { label:"运动速度", kind:"single", key:"idleSpeed", max:500, unit:"Units/s", fmt:function(){ return CFG.idleSpeed+"<small> Units/s</small>"; } }
  ]},
  burst:{ title:"一键爆发", rows:[
    { label:"运动范围", kind:"dual", key:"burstRange", link:"burstLink", linkLabel:"关联主输出",
      fmt:function(){ return CFG.burstLink ? (CFG.range[0]+"% - "+CFG.range[1]+"%<small> 关联主输出</small>") : (CFG.burstRange[0]+"% - "+CFG.burstRange[1]+"%"); } },
    { label:"运动速度", kind:"single", key:"burstSpeed", max:500, unit:"Units/s", link:"burstLinkSpeed", linkLabel:"关联主上限",
      fmt:function(){ return CFG.burstLinkSpeed ? (CFG.maxSpeed+"<small> Units/s 关联主上限</small>") : (CFG.burstSpeed+"<small> Units/s</small>"); } }
  ]}
};
function renderCard(){
  var def = CARDS[VIEW.tab], host = $("#vkTabCard");
  host.innerHTML = '<div class="ttl">'+def.title+'</div>' + def.rows.map(function(r,i){
    var linked = r.link ? !!CFG[r.link] : false;
    return '<div class="vk-row" data-row="'+i+'">'+
      '<div class="vk-rowhead"><span class="vk-label">'+r.label+'</span>'+
      '<span class="vk-value" data-val="'+i+'">'+r.fmt()+'</span></div>'+
      '<div class="vk-rowbody"><div class="vk-slider'+(linked?" disabled":"")+'" data-slider="'+i+'"></div>'+
      (r.link ? '<label class="vk-link"><input type="checkbox" data-link="'+r.link+'"'+(linked?" checked":"")+'>'+r.linkLabel+'</label>' : '')+
      '</div></div>';
  }).join("");
  def.rows.forEach(function(r,i){
    var host2 = $('[data-slider="'+i+'"]', host);
    var linked = r.link ? !!CFG[r.link] : false;
    var val = linked ? CFG.range : CFG[r.key];
    buildSlider(host2, {
      dual: r.kind === "dual", min: 0, max: r.kind === "dual" ? 100 : (r.max||500),
      values: r.kind === "dual" ? val.slice() : val,
      disabled: linked,
      onChange: function(v){
        if (r.kind === "dual") { CFG[r.key] = v; } else { CFG[r.key] = v; }
        $('[data-val="'+i+'"]', host).innerHTML = r.fmt();
      }
    });
  });
  $$("input[data-link]", host).forEach(function(cb){
    cb.addEventListener("change", function(){
      CFG[cb.getAttribute("data-link")] = cb.checked;
      renderCard();
    });
  });
}
function buildSlider(host, o){
  host.innerHTML = '<div class="vk-track"></div><div class="vk-fill"></div>'+
    (o.dual ? '<div class="vk-knob" data-h="lo"></div>' : '') + '<div class="vk-knob" data-h="hi"></div>';
  var fill = $(".vk-fill", host);
  var lo = o.dual ? o.values[0] : o.min, hi = o.dual ? o.values[1] : o.values;
  function paint(){
    var a = (lo-o.min)/(o.max-o.min)*100, b = (hi-o.min)/(o.max-o.min)*100;
    fill.style.left = a+"%"; fill.style.width = (b-a)+"%";
    if (o.dual) $('[data-h="lo"]', host).style.left = a+"%";
    $('[data-h="hi"]', host).style.left = b+"%";
  }
  paint();
  if (o.disabled) return;
  $$(".vk-knob", host).forEach(function(th){
    th.addEventListener("pointerdown", function(e){
      e.preventDefault(); th.setPointerCapture(e.pointerId);
      var isLo = th.getAttribute("data-h") === "lo";
      function move(ev){
        var r = host.getBoundingClientRect();
        var v = Math.round(Math.min(1, Math.max(0, (ev.clientX - r.left)/r.width)) * (o.max-o.min) + o.min);
        if (o.dual){
          if (isLo) lo = Math.min(v, hi-1); else hi = Math.max(v, lo+1);
          paint(); o.onChange([lo,hi]);
        } else { lo = hi = v; paint(); o.onChange(v); }
      }
      function up(ev){ th.releasePointerCapture(ev.pointerId); th.removeEventListener("pointermove",move); th.removeEventListener("pointerup",up); }
      th.addEventListener("pointermove", move); th.addEventListener("pointerup", up);
      move(e);
    });
  });
}

/* ============================ 右卡：预设网格（严格手机 PresetTile） ============================ */
function presetPoints(pr){
  var pts = [], i, acc;
  var felt = pr.previewTo > pr.previewFrom;
  if (felt){
    if (pr.keyframes && pr.keyframes.length){
      acc = 0;
      pr.keyframes.forEach(function(kf, idx){ if (idx>0) acc += Math.abs(kf[0]-pr.keyframes[idx-1][0]); pts.push([acc, kf[0]]); });
    } else {
      acc = 0; pts.push([0, pr.segments[0][0]]);
      pr.segments.forEach(function(sg){ acc += Math.abs(sg[1]-sg[0]); pts.push([acc, sg[1]]); });
    }
  } else if (pr.keyframes && pr.keyframes.length){
    pr.keyframes.forEach(function(kf){ pts.push([kf[1], kf[0]]); });
  } else {
    var t = 0, pos = pr.segments[0][0];
    pts.push([0,pos]);
    pr.segments.forEach(function(sg){ t += (sg[2] || (Math.abs(sg[1]-sg[0])*1000/Math.max(1, sg[2]||1))); pos = sg[1]; pts.push([t,pos]); });
  }
  return pts;
}
function presetLoopSec(pr){
  var travel = 0;
  if (pr.segments && pr.segments.length) pr.segments.forEach(function(sg){ travel += Math.abs(sg[1]-sg[0]); });
  else { var k = pr.keyframes; for (var i=1;i<k.length;i++) travel += Math.abs(k[i][0]-k[i-1][0]); }
  return travel/100;
}
function drawPresetWave(cv, pr){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  var ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  var pts = presetPoints(pr);
  var loopX = pts.length ? pts[pts.length-1][0] : 0;
  if (pts.length < 2 || loopX <= 0) return;
  var padX = 1, padY = 2, topY = padY, botY = h-padY, spanY = botY-topY;
  function yOf(p){ return botY - spanY*Math.min(1, Math.max(0, p/100)); }
  var felt = pr.previewTo > pr.previewFrom;
  var winFrom = felt ? loopX*pr.previewFrom/1000 : 0;
  var winTo   = felt ? loopX*pr.previewTo/1000 : loopX;
  var winLen = winTo - winFrom;
  if (winLen <= 0) return;
  function xOf(x){ return padX + (w-2*padX)*((x-winFrom)/winLen); }
  var raw = [], cStart = Math.floor(winFrom/loopX), cEnd = Math.ceil(winTo/loopX);
  for (var c=cStart;c<=cEnd;c++) pts.forEach(function(pt){ raw.push([c*loopX+pt[0], pt[1]]); });
  var line = new Path2D(), fill = new Path2D();
  fill.moveTo(xOf(winFrom), botY);
  var started = false;
  for (var i=0;i<raw.length-1;i++){
    var ax=raw[i][0], ap=raw[i][1], bx=raw[i+1][0], bp=raw[i+1][1];
    if (bx <= winFrom || ax >= winTo) continue;
    var dx = bx-ax;
    var t0 = dx<=0?0:Math.min(1,Math.max(0,(winFrom-ax)/dx));
    var t1 = dx<=0?1:Math.min(1,Math.max(0,(winTo-ax)/dx));
    if (t1 < t0) continue;
    var p1=[ax+dx*t0, ap+(bp-ap)*t0], p2=[ax+dx*t1, ap+(bp-ap)*t1];
    if (!started){ line.moveTo(xOf(p1[0]), yOf(p1[1])); fill.lineTo(xOf(p1[0]), botY); started = true; }
    line.lineTo(xOf(p1[0]), yOf(p1[1])); fill.lineTo(xOf(p1[0]), yOf(p1[1]));
    line.lineTo(xOf(p2[0]), yOf(p2[1])); fill.lineTo(xOf(p2[0]), yOf(p2[1]));
  }
  if (!started) return;
  fill.lineTo(xOf(winTo), botY); fill.closePath();
  var grd = ctx.createLinearGradient(0, topY, 0, botY);
  grd.addColorStop(0, "rgba(74,95,138,0.24)");
  grd.addColorStop(1, "rgba(74,95,138,0.03)");
  ctx.fillStyle = grd; ctx.fill(fill);
  ctx.strokeStyle = "#4A5F8A"; ctx.lineWidth = 1.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.stroke(line);
}
function layoutPresetRows(){
  var g = $("#vkPGrid"), h = g.clientHeight;
  if (!h) return;
  var gap = 10, rowH = Math.max(46, (h - gap*(VIEW.prows-1))/VIEW.prows);
  g.style.gridAutoRows = rowH + "px";
}
function renderTiles(){
  var g = $("#vkPGrid");
  g.innerHTML = PRESETS.map(function(pr){
    var sel = (VIEW.sel === pr.id);
    var s = presetLoopSec(pr);
    var label = "循环 " + (s >= 100 ? Math.round(s)+"s" : s.toFixed(1)+"s");
    return '<div class="vk-pcard'+(sel?" sel":"")+'" data-preset="'+pr.id+'">'+
      '<div class="vk-phead"><span class="vk-pname">'+((ST.preset && sel) ? "▶ " : "")+esc(pr.name)+'</span>'+
      '<span class="vk-ploop">'+label+'</span></div>'+
      '<canvas class="vk-wave" data-preset="'+pr.id+'"></canvas></div>';
  }).join("");
  layoutPresetRows();
  requestAnimationFrame(function(){
    $$(".vk-wave", g).forEach(function(cv){
      var pr = PRESETS.filter(function(x){ return x.id === cv.getAttribute("data-preset"); })[0];
      if (pr) drawPresetWave(cv, pr);
    });
  });
}
$("#vkPGrid").addEventListener("click", function(e){
  var card = e.target.closest(".vk-pcard"); if (!card) return;
  var id = card.getAttribute("data-preset");
  VIEW.sel = (VIEW.sel === id) ? null : id;
  ST.preset = !!VIEW.sel;
  renderTiles(); renderCaps();
});

/* ============================ 评审控制 ============================ */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  heatKey = "";                 /* 底色随主题变 → 位图必须重画 */
  if (window.requestAnimationFrame) requestAnimationFrame(function(){ drawHeat(); });
  var btn = $("#themeToggle");
  btn.querySelector("span").textContent = t === "dark" ? "亮色" : "暗色";
  btn.querySelector("use").setAttribute("href", t === "dark" ? "#i-sun" : "#i-moon");
  $$(".vkctrl .seg[data-ctl=theme] button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v") === t); });
}
function setCtl(ctl, v){
  var seg = $('.vkctrl .seg[data-ctl="'+ctl+'"]');
  if (seg) $$("button", seg).forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v") === v); });
  if (ctl === "theme") applyTheme(v);
  if (ctl === "stage") { if (v === "play") { if (!VIEW.playing) VIEW.playing = ENTRIES["e"].files[0]; ST.paused = false; } else { VIEW.playing = null; } renderStage(); syncTransport(); }
  if (ctl === "heat") document.body.classList.toggle("heat88", v === "h88");
  if (ctl === "prows") { VIEW.prows = parseInt(v,10); layoutPresetRows(); }
  if (ctl === "order") { VIEW.order = v; renderCaps(); }
  if (ctl === "ghost") $("#vkGhost").hidden = (v !== "on");
  heatKey = ""; layoutRound(); drawHeat(); layoutPresetRows();
}
$$(".vkctrl .seg").forEach(function(seg){
  seg.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    setCtl(seg.getAttribute("data-ctl"), b.getAttribute("data-v"));
  });
});
$("#themeToggle").addEventListener("click", function(){
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
window.__vk = {
  setCtl: setCtl,
  goto: function(pth){ VIEW.playing = null; VIEW.path = pth; renderStage(); },
  play: function(id){ var f = fileOf(id); if (f) { VIEW.playing = f; ST.paused = false; renderStage(); syncTransport(); } },
  state: function(){ return { VIEW:VIEW, ST:ST, CFG:CFG, curPos:curPos, theme:document.documentElement.getAttribute("data-theme") }; }
};
window.addEventListener("resize", function(){ heatKey = ""; layoutRound(); drawHeat(); layoutPresetRows(); $$("#vkPGrid .vk-wave").forEach(function(cv){
  var pr = PRESETS.filter(function(x){ return x.id === cv.getAttribute("data-preset"); })[0]; if (pr) drawPresetWave(cv, pr); }); });

/* ============================ 启动 ============================ */
(function(){
  var h = location.hash;
  if (/dark/.test(h)) applyTheme("dark");
  if (/light/.test(h)) applyTheme("light");
  if (/ghost/.test(h)) setCtl("ghost", "on");
  if (/heat88/.test(h)) setCtl("heat", "h88");
  if (/prow3/.test(h)) setCtl("prows", "3");
  if (/phoneorder/.test(h)) setCtl("order", "phone");
  if (/play/.test(h)) setCtl("stage", "play");
})();
renderGhost();
renderStage();
renderCaps();
renderCard();
renderTiles();
syncTransport();
requestAnimationFrame(function(){ layoutRound(); drawHeat(); layoutPresetRows(); });
})();
</script>
