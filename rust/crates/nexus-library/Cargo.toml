[package]
name = "nexus-library"
version.workspace = true
edition.workspace = true
description = "媒体库：扫描、索引、时长/缩略图探测、播放进度"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem"] }
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time"] }
